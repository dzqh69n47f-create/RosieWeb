<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交大冒險：犀牛與小西瓜的情境挑戰</title>
    <!-- 引入 React, ReactDOM 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Core -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FFFDF9;
        }
        
        /* 呼吸動畫 */
        @keyframes breath {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        .animate-breath {
            animation: breath 3s ease-in-out infinite;
        }

        /* 漸變進入效果 */
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 安全的圖示組件
        const Icon = ({ name, className = "w-5 h-5", color = "currentColor" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const iconSvg = lucide.icons[name];
                    if (iconSvg) {
                        const content = iconSvg[2] || '';
                        iconRef.current.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}">${content}</svg>`;
                    }
                }
            }, [name, className, color]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const scenarios = [
          { id: 1, category: '壞口氣怪獸', icon: '🗣️', title: '收東西太慢', content: '犀牛在收書包，小西瓜大叫：「你動作很慢耶！擋到我了啦！」', prompt: '如果你是犀牛，聽到這種語氣，你心裡是什麼感覺？你可以怎麼回應？' },
          { id: 2, category: '壞口氣怪獸', icon: '🗣️', title: '想加入遊戲', content: '犀牛想玩球，小西瓜叉腰說：「我們人滿了，你走開啦！」', prompt: '拒絕別人時，語氣可以怎麼調整才不會讓人受傷？' },
          { id: 3, category: '壞口氣怪獸', icon: '🗣️', title: '命令式說話', content: '小西瓜指著地上的垃圾對犀牛吼：「喂！那個垃圾你拿去丟掉！」', prompt: '小西瓜想要犀牛幫忙，應該要怎麼說才對？' },
          { id: 4, category: '壞口氣怪獸', icon: '🗣️', title: '嫌棄分組', content: '老師宣布分組，小西瓜嘆氣說：「厚！為什麼我要跟犀牛一組，真倒楣。」', prompt: '在大家面前被嫌棄，犀牛心裡的小怪獸會跳出來嗎？他該怎麼辦？' },
          { id: 5, category: '壞口氣怪獸', icon: '🗣️', title: '催促聲', content: '犀牛在寫字，小西瓜在旁邊一直敲桌子：「快點啦！你怎麼還沒寫完！」', prompt: '當別人在忙的時候，一直催促會造成什麼影響？' },
          { id: 6, category: '壞口氣怪獸', icon: '🗣️', title: '嘲笑失誤', content: '犀牛不小心把水弄翻了，小西瓜大笑：「哈哈！犀牛你好笨喔！」', prompt: '當別人犯錯時，嘲笑會讓情況變好嗎？' },
          { id: 7, category: '意外小火花', icon: '✨', title: '排隊碰撞', content: '排隊領午餐時，小西瓜不小心撞到犀牛的背，卻沒道歉就跑走。', prompt: '犀牛這時候應該覺得小西瓜是故意的嗎？他該去問清楚嗎？' },
          { id: 8, category: '意外小火花', icon: '✨', title: '文具被弄掉', content: '小西瓜經過桌子，把犀牛的彩色筆掃到地上，還大聲說：「誰叫你放桌邊！」', prompt: '這是一場意外還是故意的？小西瓜為什麼要先大聲說話？' },
          { id: 9, category: '意外小火花', icon: '✨', title: '喝水噴到', content: '小西瓜喝水時不小心噴到犀牛的衣服，還笑嘻嘻地看著他。', prompt: '「笑嘻嘻」的反應可能會讓犀牛誤會什麼？' },
          { id: 10, category: '意外小火花', icon: '✨', title: '位子被坐', content: '犀牛上完廁所回來，發現小西瓜坐在他的位置上說：「這現在是我的位子了！」', prompt: '如果小西瓜只是想開玩笑，這個玩笑適合嗎？' },
          { id: 11, category: '桌遊大挑戰', icon: '🎲', title: '皇后被搶', content: '玩《睡皇后》時，小西瓜連續兩次搶走犀牛最喜歡的「鬆餅皇后」。', prompt: '玩遊戲被針對時，要如何控制想發火的情緒？' },
          { id: 12, category: '桌遊大挑戰', icon: '🎲', title: '高塔倒塌', content: '疊《超級犀牛》時，小西瓜手晃了一下讓塔倒掉，卻怪犀牛：「是你剛才弄歪的！」', prompt: '推卸責任會讓以後還有同學想跟你玩遊戲嗎？' },
          { id: 13, category: '桌遊大挑戰', icon: '🎲', title: '抽不到好牌', content: '犀牛連續五回合都抽到數字牌，一張國王都沒有，心裡好想撕掉牌。', prompt: '這時候犀牛可以對自己說什麼話來轉移失落感？' },
          { id: 14, category: '桌遊大挑戰', icon: '🎲', title: '被暫停回合', content: '小西瓜對犀牛出了一張「睡眠卡」，害犀牛這一輪不能動，只能看別人玩。', prompt: '這是遊戲規則。犀牛這時候可以做什麼來度過等待的時間？' },
          { id: 15, category: '桌遊大挑戰', icon: '🎲', title: '被說作弊', content: '犀牛不小心多拿一張牌，小西瓜指著他大喊：「老師！犀牛作弊！他壞壞！」', prompt: '發現別人犯錯時，除了大喊「告狀」，還有更好的溝通方式嗎？' },
          { id: 16, category: '社交小衝突', icon: '💬', title: '借東西不還', content: '小西瓜借了犀牛的橡皮擦，結果弄丟了，還回嘴：「不就一個橡皮擦，小氣鬼！」', prompt: '如果你是犀牛，你會怎麼捍衛自己的東西，又不跟對方吵架？' },
          { id: 17, category: '社交小衝突', icon: '💬', title: '被取綽號', content: '小西瓜一直叫犀牛他不喜歡的難聽綽號，全班都在看。', prompt: '這時候犀牛應該：1.罵回去 2.裝沒聽到 3.嚴肅告訴對方我不喜歡？' },
          { id: 18, category: '社交小衝突', icon: '💬', title: '意見被反對', content: '討論要去哪裡玩，犀牛想去操場，小西瓜大聲反對：「誰要去操場，無聊死了！」', prompt: '大家意見不同時，如何有禮貌地表達反對？' },
          { id: 19, category: '社交小衝突', icon: '💬', title: '被冤枉了', content: '老師問誰在講話，明明是小西瓜，小西瓜卻指著犀牛說：「是他先跟我說話的！」', prompt: '被冤枉時，犀牛該如何冷靜向老師說明情況？' },
          { id: 20, category: '社交小衝突', icon: '💬', title: '環境太吵', content: '教室裡大家都在吵架，犀牛覺得耳朵好痛、頭好亂，好想衝出教室跑掉。', prompt: '犀牛感覺到感官超載了，他可以怎麼跟老師求助？' },
        ];

        const categories = [
          { name: '全部', icon: 'Shuffle', color: 'bg-slate-500' },
          { name: '壞口氣怪獸', icon: 'MessageCircle', color: 'bg-rose-400' },
          { name: '意外小火花', icon: 'AlertTriangle', color: 'bg-amber-400' },
          { name: '桌遊大挑戰', icon: 'Sword', color: 'bg-emerald-400' },
          { name: '社交小衝突', icon: 'BookOpen', color: 'bg-indigo-400' },
        ];

        function App() {
          const [selectedCategory, setSelectedCategory] = useState('全部');
          const [currentScenario, setCurrentScenario] = useState(null);
          const [isDrawing, setIsDrawing] = useState(false);
          const [history, setHistory] = useState([]);
          
          // 互動狀態：0=顯示卡片, 1=冷靜步驟, 2=社交解碼, 3=最終討論
          const [step, setStep] = useState(0);
          
          // 冷靜步驟細項：'stop', 'breath', 'hand', 'done'
          const [calmSubStep, setCalmSubStep] = useState('stop');
          const [breathTimer, setBreathTimer] = useState(0);
          const [breathFinished, setBreathFinished] = useState(false);

          const drawScenario = () => {
            if (currentScenario && step < 3) return;

            setIsDrawing(true);
            setStep(0);
            setCalmSubStep('stop');
            setBreathTimer(0);
            setBreathFinished(false);
            
            const filtered = scenarios.filter(s => selectedCategory === '全部' || s.category === selectedCategory);
            let available = filtered.filter(s => !history.includes(s.id));

            if (available.length === 0) {
                available = filtered.filter(s => s.id !== currentScenario?.id);
                if (available.length === 0) available = filtered;
            } else {
                available = available.filter(s => s.id !== currentScenario?.id);
                if (available.length === 0) available = [filtered.find(s => !history.includes(s.id)) || filtered[0]];
            }

            setTimeout(() => {
              const picked = available[Math.floor(Math.random() * available.length)];
              setCurrentScenario(picked);
              setHistory(prev => prev.includes(picked.id) ? prev : [...prev, picked.id]);
              setIsDrawing(false);
            }, 850);
          };

          const handleBreath = () => {
            setBreathFinished(false);
            setBreathTimer(3);
            const interval = setInterval(() => {
                setBreathTimer(prev => {
                    if (prev <= 1) {
                        clearInterval(interval);
                        setBreathFinished(true);
                        return 0;
                    }
                    return prev - 1;
                });
            }, 1000);
          };

          const goBackToStart = () => {
            setCurrentScenario(null);
            setStep(0);
          };

          const resetGame = () => {
            setHistory([]);
            setCurrentScenario(null);
            setStep(0);
          };

          const restartCalmExercise = () => {
            setCalmSubStep('stop');
            setBreathTimer(0);
            setBreathFinished(false);
          };

          const isDrawDisabled = isDrawing || (currentScenario && step < 3);

          return (
            <div className="min-h-screen p-4 md:p-8 selection:bg-rose-100">
              <div className="max-w-6xl mx-auto">
                
                {/* 頂部標記 */}
                <div className="flex justify-center mb-4">
                  <span className="bg-rose-50 text-rose-500 px-4 py-1 rounded-full text-sm font-bold border border-rose-100 shadow-sm flex items-center gap-2">
                    <Icon name="Star" className="w-3 h-3" color="#f43f5e" /> 鏡如老師 編制
                  </span>
                </div>

                {/* 標題 */}
                <header className="text-center mb-8">
                  <h1 className="text-4xl md:text-5xl font-black text-[#2D3436] tracking-tight flex items-center justify-center gap-4">
                    <span>🦏</span> 
                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-emerald-600 to-rose-500">
                      社交大冒險
                    </span>
                    <span>🍉</span>
                  </h1>
                </header>

                {/* 分類按鈕 */}
                <div className="flex flex-wrap justify-center gap-3 mb-8">
                  {categories.map((cat) => (
                    <button
                      key={cat.name}
                      onClick={() => {
                        if (!isDrawDisabled) setSelectedCategory(cat.name);
                      }}
                      disabled={isDrawDisabled}
                      className={`flex items-center gap-2 px-5 py-2 rounded-2xl transition-all duration-300 border-b-4 ${
                        isDrawDisabled ? 'opacity-50 cursor-not-allowed' : ''
                      } ${
                        selectedCategory === cat.name
                          ? `${cat.color} text-white border-black/10 shadow-lg -translate-y-1`
                          : 'bg-white text-slate-500 border-slate-100 hover:border-slate-200'
                      }`}
                    >
                      <Icon name={cat.icon} className="w-5 h-5" color={selectedCategory === cat.name ? "white" : "#94a3b8"} />
                      <span className="font-bold">{cat.name}</span>
                    </button>
                  ))}
                </div>

                <div className="grid lg:grid-cols-12 gap-8 items-start">
                  
                  {/* 左側：情境卡片區 */}
                  <div className="lg:col-span-6 flex flex-col items-center">
                    <div 
                      className={`relative w-full aspect-[4/5] max-w-sm rounded-[2.5rem] shadow-xl transition-all duration-700 border-[12px] border-white overflow-hidden ${
                        currentScenario ? 'bg-white' : 'bg-gradient-to-br from-emerald-400 to-rose-400'
                      }`}
                    >
                      {isDrawing ? (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-white p-6 text-center">
                          <div className="w-16 h-16 border-[6px] border-white/30 border-t-white rounded-full animate-spin mb-6"></div>
                          <p className="text-2xl font-black">翻牌中...</p>
                        </div>
                      ) : currentScenario ? (
                        <div className="p-8 h-full flex flex-col relative fade-in">
                          <div className="flex items-center justify-between mb-6">
                            <span className="px-3 py-1 bg-rose-50 text-rose-500 text-xs font-black rounded-full uppercase border border-rose-100">
                              {currentScenario.category}
                            </span>
                            <span className="text-3xl">{currentScenario.icon}</span>
                          </div>
                          <h3 className="text-2xl font-black text-slate-800 mb-6">{currentScenario.title}</h3>
                          <div className="flex-grow flex items-center justify-center bg-slate-50 rounded-[2rem] p-6 border-2 border-dashed border-slate-200">
                            <p className="text-lg md:text-xl leading-relaxed text-slate-700 font-bold text-center">
                              「{currentScenario.content}」
                            </p>
                          </div>
                          <div className="mt-6 flex justify-between items-center text-slate-200">
                             <div className="text-[10px] font-black tracking-widest uppercase">Scenario #{currentScenario.id}</div>
                             <Icon name="CheckCircle2" className="w-6 h-6" color={history.includes(currentScenario.id) ? "#10b981" : "currentColor"} />
                          </div>
                        </div>
                      ) : (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-white p-10 text-center">
                          <Icon name="Shuffle" className="w-12 h-12 mb-6" color="white" />
                          <h2 className="text-2xl font-black mb-4">準備好了嗎？</h2>
                          <p className="opacity-80 font-medium">請選擇類別並抽取挑戰</p>
                        </div>
                      )}
                    </div>

                    <div className="flex flex-col gap-3 w-full max-w-sm mt-8">
                      <button
                        onClick={drawScenario}
                        disabled={isDrawDisabled}
                        className={`flex items-center justify-center gap-3 px-8 py-4 font-black text-white rounded-2xl transition-all shadow-lg ${
                            isDrawDisabled 
                            ? 'bg-slate-400 cursor-not-allowed opacity-80' 
                            : 'bg-rose-500 hover:bg-rose-600'
                        }`}
                      >
                        <Icon name="Shuffle" className={isDrawing ? 'animate-spin' : ''} color="white" />
                        <span>
                            {isDrawing ? '抽取中...' : (currentScenario && step < 3 ? '請先完成目前挑戰' : (currentScenario ? '🎲 再抽一場挑戰' : '🎲 開始抽取挑戰'))}
                        </span>
                      </button>
                      
                      {currentScenario && step === 0 && !isDrawing && (
                        <button 
                            onClick={() => setStep(1)}
                            className="flex items-center justify-center gap-3 px-8 py-4 font-black text-white bg-emerald-500 rounded-2xl hover:bg-emerald-600 shadow-lg animate-bounce"
                        >
                            <span>👉 進入冷靜練習</span>
                        </button>
                      )}
                      
                      {currentScenario && !isDrawing && (
                        <button onClick={goBackToStart} className="text-slate-400 font-bold text-sm mt-2 hover:text-slate-600 transition-colors">
                          重置挑戰並返回封面
                        </button>
                      )}
                    </div>
                  </div>

                  {/* 右側：互動步驟區 */}
                  <div className="lg:col-span-6 space-y-6">
                    {currentScenario && step === 1 && (
                        <div className="bg-white rounded-[2rem] p-8 shadow-md border border-slate-100 fade-in">
                            <h4 className="text-xl font-black text-indigo-600 mb-6 flex items-center gap-2">
                                <Icon name="Zap" color="#4f46e5" /> 步驟 1：生理冷靜練習
                            </h4>
                            <div className="flex flex-col items-center gap-8 py-4">
                                <div className="flex w-full items-center gap-4">
                                    <button 
                                        onClick={() => setCalmSubStep('breath')}
                                        className={`w-20 h-20 rounded-full flex items-center justify-center transition-all ${calmSubStep === 'stop' ? 'bg-rose-500 scale-110 shadow-lg' : 'bg-slate-100 opacity-40'}`}
                                    >
                                        <span className="text-3xl">🛑</span>
                                    </button>
                                    <div className={calmSubStep === 'stop' ? 'font-black text-slate-800' : 'text-slate-400'}>
                                        <p className="text-lg font-black">停一下</p>
                                        <p className="text-sm">看見衝動，先踩剎車。</p>
                                    </div>
                                </div>

                                <div className="flex w-full items-center gap-4">
                                    <button 
                                        onClick={() => { if(calmSubStep === 'breath') handleBreath(); }}
                                        disabled={breathTimer > 0}
                                        className={`w-20 h-20 rounded-full flex items-center justify-center transition-all relative ${calmSubStep === 'breath' ? 'bg-blue-400 scale-110 shadow-lg' : 'bg-slate-100 opacity-40'}`}
                                    >
                                        {breathTimer > 0 && <div className="absolute inset-0 bg-blue-300 rounded-full animate-breath"></div>}
                                        <span className="text-3xl relative z-10">{breathTimer > 0 ? breathTimer : '🌬️'}</span>
                                    </button>
                                    <div className={calmSubStep === 'breath' ? 'font-black text-slate-800' : 'text-slate-400'}>
                                        <p className="text-lg font-black">深呼吸</p>
                                        <p className="text-sm">點選圖示練習：吸氣、吐氣，數到三。</p>
                                        {calmSubStep === 'breath' && breathFinished && (
                                            <button 
                                                onClick={() => setCalmSubStep('hand')} 
                                                className="mt-2 text-xs bg-indigo-500 text-white px-3 py-1.5 rounded-lg shadow-sm font-bold fade-in"
                                            >
                                                完成呼吸
                                            </button>
                                        )}
                                    </div>
                                </div>

                                <div className="flex w-full items-center gap-4">
                                    <button 
                                        onClick={() => setCalmSubStep('done')}
                                        className={`w-20 h-20 rounded-full flex items-center justify-center transition-all ${calmSubStep === 'hand' ? 'bg-amber-400 scale-110 shadow-lg' : 'bg-slate-100 opacity-40'}`}
                                    >
                                        <span className="text-3xl">✋</span>
                                    </button>
                                    <div className={calmSubStep === 'hand' ? 'font-black text-slate-800' : 'text-slate-400'}>
                                        <p className="text-lg font-black">安全動作</p>
                                        <p className="text-sm">做出安全的替代動作。</p>
                                    </div>
                                </div>
                            </div>
                            {calmSubStep === 'done' && (
                                <div className="grid grid-cols-2 gap-4 mt-6 fade-in">
                                    <button 
                                        onClick={restartCalmExercise} 
                                        className="flex items-center justify-center gap-2 bg-slate-100 text-slate-600 font-black py-4 rounded-2xl border border-slate-200 hover:bg-slate-200 transition-all"
                                    >
                                        <Icon name="RotateCcw" className="w-4 h-4" /> 再練習一次
                                    </button>
                                    <button 
                                        onClick={() => setStep(2)} 
                                        className="bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-indigo-700 transition-all"
                                    >
                                        進入下一步
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {currentScenario && step === 2 && (
                        <div className="bg-white rounded-[2rem] p-8 shadow-md border border-slate-100 fade-in text-center">
                            <h4 className="text-xl font-black text-indigo-600 mb-6 flex items-center justify-center gap-2">
                                <Icon name="Search" color="#4f46e5" /> 步驟 2：社交解碼
                            </h4>
                            <div className="py-10 bg-indigo-50/50 rounded-3xl mb-8">
                                <p className="text-2xl font-black text-indigo-900 leading-relaxed px-4">
                                    「你覺得小西瓜現在在想什麼？」
                                </p>
                                <p className="mt-4 text-slate-500 font-bold">請同學口頭回答或與老師討論</p>
                            </div>
                            <div className="grid grid-cols-1 gap-4">
                                <button 
                                    onClick={() => setStep(3)}
                                    className="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-3"
                                >
                                    <span>進入最後討論</span>
                                    <Icon name="ChevronRight" color="white" />
                                </button>
                                <button 
                                    onClick={() => setStep(1)}
                                    className="w-full bg-white text-slate-400 font-bold py-3 rounded-2xl border border-slate-100 hover:bg-slate-50 transition-all flex items-center justify-center gap-2"
                                >
                                    <Icon name="ArrowLeft" className="w-4 h-4" color="currentColor" />
                                    <span>返回上一步練習冷靜</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {currentScenario && step === 3 && (
                        <div className="space-y-6 fade-in">
                            <div className="bg-white rounded-[2rem] p-8 shadow-md border border-slate-100 relative overflow-hidden">
                                <h4 className="text-xl font-black text-indigo-600 mb-6 flex items-center gap-2">
                                    <Icon name="MessageCircle" color="#4f46e5" /> 步驟 3：對話討論
                                </h4>
                                <div className="p-6 bg-slate-50 rounded-2xl border-l-8 border-indigo-400 mb-6">
                                    <p className="text-slate-800 font-bold text-lg leading-relaxed">{currentScenario.prompt}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="p-4 bg-rose-50 rounded-xl border border-rose-100 text-center">
                                        <p className="text-xs font-black text-rose-400 uppercase tracking-widest mb-1">心情探測</p>
                                        <p className="text-sm font-bold text-rose-700">犀牛感覺如何？</p>
                                    </div>
                                    <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-100 text-center">
                                        <p className="text-xs font-black text-emerald-400 uppercase tracking-widest mb-1">解決之道</p>
                                        <p className="text-sm font-bold text-emerald-700">該說什麼話？</p>
                                    </div>
                                </div>

                                <div className="mt-8 pt-6 border-t border-slate-100 flex flex-col items-center gap-4">
                                    <div className="bg-emerald-50 text-emerald-600 px-6 py-3 rounded-2xl font-black flex items-center gap-2">
                                        <Icon name="CheckCircle2" className="w-5 h-5" color="#10b981" />
                                        挑戰完成！現在可以抽取下一張牌了。
                                    </div>
                                    <button 
                                        onClick={() => setStep(2)}
                                        className="text-slate-400 font-bold text-sm hover:text-indigo-500 transition-all flex items-center gap-2"
                                    >
                                        <Icon name="ArrowLeft" className="w-3 h-3" color="currentColor" />
                                        返回上一步重新解碼
                                    </button>
                                </div>
                            </div>
                            
                            <div className="bg-[#2D3436] rounded-[2rem] p-8 text-white shadow-xl relative overflow-hidden">
                                <h4 className="font-black text-rose-400 mb-4 flex items-center gap-2 tracking-wide uppercase">💡 應對小撇步 (SOS)</h4>
                                <ul className="space-y-4">
                                    <li className="flex gap-4">
                                        <div className="w-8 h-8 rounded-lg bg-rose-500 flex-shrink-0 flex items-center justify-center font-black">S</div> 
                                        <div><span className="font-black block text-sm">Stop 停下來</span><span className="text-xs text-slate-400">剛才我們已經練習過，先冷靜。</span></div>
                                    </li>
                                    <li className="flex gap-4">
                                        <div className="w-8 h-8 rounded-lg bg-amber-500 flex-shrink-0 flex items-center justify-center font-black">O</div> 
                                        <div><span className="font-black block text-sm">Observe 觀察</span><span className="text-xs text-slate-400">想想對方的行為可能有什麼原因。</span></div>
                                    </li>
                                    <li className="flex gap-4">
                                        <div className="w-8 h-8 rounded-lg bg-emerald-500 flex-shrink-0 flex items-center justify-center font-black">S</div> 
                                        <div><span className="font-black block text-sm">Speak 說感受</span><span className="text-xs text-slate-400">練習用禮貌的語氣回應對方。</span></div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    )}

                    {!currentScenario && (
                        <div className="bg-white rounded-[2rem] p-8 shadow-md border border-slate-100 text-center py-20">
                            <Icon name="Star" className="w-16 h-16 opacity-10 mb-4" color="#e2e8f0" />
                            <p className="text-slate-400 font-medium italic">請抽取情境卡，展開大冒險！</p>
                        </div>
                    )}
                    
                    <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
                        <div className="flex justify-between items-center mb-4">
                            <h4 className="font-black text-slate-600 text-sm">挑戰足跡 ({history.length}/20)</h4>
                            <button onClick={resetGame} className="text-[10px] font-black text-slate-300 hover:text-rose-400 uppercase tracking-widest">重置紀錄</button>
                        </div>
                        <div className="grid grid-cols-10 gap-1">
                            {Array.from({ length: 20 }).map((_, i) => (
                                <div key={i} className={`h-2 rounded-full ${history.includes(i + 1) ? 'bg-emerald-400' : 'bg-slate-100'}`}></div>
                            ))}
                        </div>
                    </div>
                  </div>
                </div>

                {/* 頁尾 */}
                <footer className="mt-16 pb-10 text-center">
                    <span className="bg-slate-100 text-slate-400 px-6 py-2 rounded-2xl text-xs font-black tracking-widest uppercase">鏡如老師 編制</span>
                    <p className="text-slate-400 text-xs mt-4 leading-loose">
                        本教材專為國中小社交技巧訓練設計。透過生理調節與社交解碼，<br/>建立情障生與自閉症學生的情緒穩定期與社交覺察力。
                    </p>
                </footer>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
